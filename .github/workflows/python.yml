name: Security Studio checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate on Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python package
        shell: pwsh
        run: python -m compileall securitysuite tools tests generate_rules.py run.py

      - name: Validate dashboard JavaScript
        shell: pwsh
        run: |
          node --check web/app.js
          node --check web/briefing.js
          node --check web/settings.js
          node --check web/studio.js
          node tests/frontend.mjs

      - name: Run smoke tests
        shell: pwsh
        run: python tests/smoke.py

      - name: Run API tests
        shell: pwsh
        run: python tests/test_api.py

      - name: Generate database summary
        shell: pwsh
        run: python tools/summarize_database.py --output docs/database-summary.md
